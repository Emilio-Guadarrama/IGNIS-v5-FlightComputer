<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="Segoe UI, Arial, sans-serif">
  <rect width="640" height="600" fill="#ffffff"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">IGNIS v5: proposed placement zones (preliminary)</text>
  <text x="320" y="48" text-anchor="middle" font-size="12" fill="#a33">Zone sketch from the netlist. Not a layout, not DRC-checked. Octagon 66.5 mm across flats.</text>
  <polygon points="215,70 425,70 570,215 570,425 425,570 215,570 70,425 70,215" fill="#f4f7f3" stroke="#222" stroke-width="2.5"/>
  <!-- N antenna -->
  <rect x="245" y="70" width="150" height="34" fill="#fde2e2" stroke="#b33" stroke-dasharray="5 3"/>
  <text x="320" y="92" text-anchor="middle" font-size="11" fill="#a22">ESP32 antenna keepout (N edge)</text>
  <rect x="265" y="106" width="110" height="150" rx="3" fill="#dbe9f8" stroke="#235"/>
  <text x="320" y="176" text-anchor="middle" font-size="13" font-weight="bold">MCU1</text>
  <text x="320" y="194" text-anchor="middle" font-size="11">ESP32-S3-WROOM-1</text>
  <!-- NW -->
  <rect x="115" y="110" width="125" height="52" fill="#fff3cf" stroke="#885"/>
  <text x="177" y="132" text-anchor="middle" font-size="11">LED1-3, S1 reset</text>
  <text x="177" y="148" text-anchor="middle" font-size="10" fill="#555">NW</text>
  <!-- W -->
  <rect x="78" y="250" width="58" height="105" fill="#e6e0f5" stroke="#547"/>
  <text x="107" y="298" text-anchor="middle" font-size="11">USB-C</text>
  <text x="107" y="312" text-anchor="middle" font-size="10">J1 + ESD</text>
  <text x="107" y="326" text-anchor="middle" font-size="10" fill="#555">W</text>
  <rect x="150" y="215" width="95" height="40" fill="#eee" stroke="#777"/>
  <text x="197" y="239" text-anchor="middle" font-size="11">buzzer LS1</text>
  <!-- centre GNSS -->
  <rect x="265" y="290" width="110" height="90" rx="3" fill="#d8f0dc" stroke="#264"/>
  <text x="320" y="330" text-anchor="middle" font-size="13" font-weight="bold">U3 GNSS</text>
  <text x="320" y="348" text-anchor="middle" font-size="11">patch faces nose</text>
  <text x="320" y="364" text-anchor="middle" font-size="10" fill="#555">centre, solid GND below</text>
  <!-- E -->
  <rect x="475" y="260" width="90" height="100" fill="#ffe9d0" stroke="#852"/>
  <text x="520" y="305" text-anchor="middle" font-size="12" font-weight="bold">CARD1</text>
  <text x="520" y="321" text-anchor="middle" font-size="11">microSD (E)</text>
  <rect x="395" y="200" width="85" height="55" fill="#e8f5ff" stroke="#357"/>
  <text x="437" y="224" text-anchor="middle" font-size="11">IMU U5 (top)</text>
  <text x="437" y="240" text-anchor="middle" font-size="10">baro U6 (bottom, vent)</text>
  <!-- NE -->
  <rect x="440" y="110" width="110" height="52" fill="#eee" stroke="#777"/>
  <text x="495" y="132" text-anchor="middle" font-size="11">J2 debug, S2 boot</text>
  <text x="495" y="148" text-anchor="middle" font-size="10" fill="#555">NE</text>
  <!-- SE -->
  <rect x="395" y="440" width="120" height="70" fill="#fde2e2" stroke="#a33"/>
  <text x="455" y="468" text-anchor="middle" font-size="12" font-weight="bold">U4 RFM95W</text>
  <text x="455" y="485" text-anchor="middle" font-size="11">+ J4 SMA (SE edge)</text>
  <text x="455" y="500" text-anchor="middle" font-size="10" fill="#555">RF keepout + via fence</text>
  <!-- SW -->
  <rect x="95" y="410" width="150" height="85" fill="#f6e0b8" stroke="#862"/>
  <text x="170" y="436" text-anchor="middle" font-size="12" font-weight="bold">Power (SW)</text>
  <text x="170" y="453" text-anchor="middle" font-size="11">J3 XT30, U1 5V, U2 3.3V</text>
  <text x="170" y="469" text-anchor="middle" font-size="10">thermal copper + via arrays</text>
  <text x="170" y="485" text-anchor="middle" font-size="10">VBAT divider, D2</text>
  <!-- S pyro -->
  <rect x="255" y="470" width="125" height="70" fill="#f9d6d6" stroke="#a22" stroke-width="2"/>
  <text x="317" y="495" text-anchor="middle" font-size="12" font-weight="bold">J5 terminal (top)</text>
  <text x="317" y="512" text-anchor="middle" font-size="11">pyro circuit (bottom)</text>
  <text x="317" y="528" text-anchor="middle" font-size="10" fill="#a22">sign-off required</text>
  <text x="320" y="590" text-anchor="middle" font-size="11" fill="#555">Top view, ESP32 antenna on N. Which edge faces the nose and the mounting holes are still open. See docs/LAYOUT_PROPOSAL_2026-11-11.md.</text>
</svg>
